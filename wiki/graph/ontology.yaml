# Wiki Graph Ontology — career domain
#
# Declares the node types and predicates the optional compiled graph layer
# recognises. `scripts/wiki_graph_lint.py` validates every typed edge declared
# in page frontmatter against this file.
#
# Markdown is canonical. This file is only the contract that makes the graph
# machine-checkable. Delete the generated artifacts any time; they rebuild.

node_types:
  person:
    maps_from: { type: entity, kind: person }
  company:
    maps_from: { type: entity, kind: company }
  position:
    maps_from: { type: entity, kind: position }
  client:
    maps_from: { type: entity, kind: client }
  project:
    maps_from: { type: entity, kind: project }
  education:
    maps_from: { type: entity, kind: education }
  concept:
    maps_from: { type: concept }
  source:
    maps_from: { type: source }
  synthesis:
    maps_from: { type: synthesis }
  decision:
    explicit_only: true
  claim:
    explicit_only: true
  raw:
    explicit_only: true

predicates:
  # --- Implicit predicates emitted by the extractor. ---
  mentions:
    subject_types: ["*"]
    object_types: ["*"]
    requires_evidence: false
    description: |
      Low-specificity edge derived from body wikilinks. Navigation only,
      not evidence of a typed relationship.
  sourced_from:
    subject_types: ["*"]
    object_types: [source]
    requires_evidence: false
    description: |
      Derived from each non-source page's frontmatter `sources:` list.
      Never points at a destination spec or a draft.
  summarizes_raw:
    subject_types: [source]
    object_types: ["*"]
    requires_evidence: false
    description: |
      Derived from a source page's frontmatter `raw:` field. Object is a
      file path string, not a wiki node id.

  # --- Typed career predicates. ---
  works_at:
    subject_types: [person]
    object_types: [company]
    requires_evidence: true
    description: Employment relationship, period carried by a position node.
  held_position:
    subject_types: [person]
    object_types: [position]
    requires_evidence: true
  at_company:
    subject_types: [position]
    object_types: [company]
    requires_evidence: true
    description: The position was paid by this company.
  delivered_for:
    subject_types: [position, project]
    object_types: [client]
    requires_evidence: true
    description: End client of the work, when it differs from the employer.
  followed_by:
    subject_types: [position]
    object_types: [position]
    requires_evidence: true
    description: |
      Sequential, non-overlapping succession. Use it to encode "these roles
      ran one after another, not in parallel" — a claim worth an explicit edge
      because recruiters routinely misread overlapping clients as concurrent jobs.
  uses_stack:
    subject_types: [position, project, company]
    object_types: [concept]
    requires_evidence: true
  earned:
    subject_types: [person]
    object_types: [education]
    requires_evidence: true
  produced:
    subject_types: [person, project]
    object_types: [project]
    requires_evidence: true
  contradicts:
    subject_types: [claim, source, synthesis]
    object_types: [claim, source, synthesis]
    requires_evidence: true
  supersedes:
    subject_types: [claim, source, synthesis, decision]
    object_types: [claim, source, synthesis, decision]
    requires_evidence: true
  cites:
    subject_types: [synthesis, concept, position]
    object_types: [source]
    requires_evidence: true
